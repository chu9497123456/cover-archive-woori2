<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>표지 아카이브</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:#222;font:15px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:42px 24px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}h1{font-size:30px;letter-spacing:-1.5px;margin:0}p{color:#777}button,input,select,textarea{font:inherit;border:1px solid #d7d7d2;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#252e27;color:white;border:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}#q{flex:1;min-width:160px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:24px}.item{min-width:0}.cover{background:#eaeae5;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden;cursor:pointer}.cover img{width:100%;height:100%;object-fit:contain}.meta{display:flex;justify-content:space-between;align-items:start;margin-top:10px}.meta button{border:0;background:none;padding:0;font-size:23px}.name{font-weight:700;overflow-wrap:anywhere}.small{font-size:12px;color:#777;margin:5px 0}.tags{font-size:12px;color:#536453;overflow-wrap:anywhere}dialog{border:1px solid #ddd;border-radius:14px;width:min(480px,94vw);padding:24px}dialog::backdrop{background:#0006}label{display:block;margin:12px 0 5px;font-size:13px}dialog input:not([type=file]),dialog select,textarea{width:100%}.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}#empty{text-align:center;padding:70px 10px;border:1px dashed #ccc;border-radius:12px;color:#777}footer{margin-top:40px;font-size:12px;color:#777}</style><main><header><div><h1>표지 아카이브</h1><p>어린이책 디자인 레퍼런스</p></div><button class="primary" onclick="edit()">＋ 표지 등록</button></header><div class="toolbar"><input id="q" placeholder="도서명, 출판사, 태그 검색"><select id="cat"><option value="">전체 분야</option></select><select id="tag"><option value="">전체 디자인 태그</option></select><button id="fav">☆ 즐겨찾기</button><button onclick="backup()">내보내기</button><button onclick="document.getElementById('import').click()">가져오기</button><input hidden type="file" id="import" accept=".json"></div><p id="count"></p><div id="grid"></div><div id="empty">아직 등록된 표지가 없습니다. 표지를 등록하거나 검색 조건을 변경하세요.</div><footer>이 브라우저에 저장됩니다. 팀 공유 시 JSON 파일을 내보내고 가져오세요. 실시간 동기화는 지원하지 않습니다.</footer></main><dialog id="dlg"><form id="form" novalidate><h2 id="heading">표지 등록</h2><label>표지 이미지 (파일)</label><input type="file" id="photo" accept="image/*"><label>또는 이미지 URL</label><input id="url" type="url" placeholder="https://..."><label>도서명</label><input id="bookname" placeholder="도서명 (미입력 시 파일명 사용)"><label>출판사</label><input id="pub"><label>분야</label><select id="category"></select><label>디자인 태그 (쉼표로 구분)</label><input id="tags" placeholder="색감, 타이포그래피, 일러스트"><label>디자인 메모</label><textarea id="note" rows="4"></textarea><label>도서 상세 페이지 URL</label><input id="link" type="url" placeholder="https://..."><div class="actions"><button class="primary" type="button" id="saveButton">저장</button><button type="button" onclick="dlg.close()">닫기</button><button type="button" id="remove" onclick="del()">삭제</button><button type="button" id="visit" onclick="if(link.value)window.open(link.value,'_blank','noopener')">도서 페이지</button></div></form></dialog><script>const $=id=>document.getElementById(id),cats=['그림책','저학년 동화','고학년 동화','어린이 교양','청소년','기타'];let data=[];try{data=JSON.parse(localStorage.getItem('coverArchiveV1')||'[]')}catch{}let current=null,only=false;for(const c of cats){$('cat').add(new Option(c,c));$('category').add(new Option(c,c))}function save(next){try{localStorage.setItem('coverArchiveV1',JSON.stringify(next));data=next;render();return true}catch(e){alert('저장 실패: '+(e.name==='QuotaExceededError'?'브라우저 저장 공간이 부족합니다.':e.message));return false}}function el(tag,cls,txt){let e=document.createElement(tag);e.className=cls;if(txt)e.textContent=txt;return e}function render(){let t=$('tag').value;$('tag').replaceChildren(new Option('전체 디자인 태그',''));[...new Set(data.flatMap(x=>x.tags))].sort().forEach(x=>$('tag').add(new Option(x,x)));$('tag').value=t;let q=$('q').value.toLowerCase(),items=data.filter(x=>(!only||x.fav)&&(!$('cat').value||x.category===$('cat').value)&&(!$('tag').value||x.tags.includes($('tag').value))&&[x.name,x.pub,x.note,...x.tags].join(' ').toLowerCase().includes(q));$('grid').replaceChildren();$('count').textContent=`${items.length}권 / 전체 ${data.length}권`;$('empty').hidden=items.length>0;for(let x of items){let a=el('article','item'),c=el('div','cover');c.tabIndex=0;c.setAttribute('role','button');c.onclick=()=>edit(x.id);c.onkeydown=e=>{if(e.key==='Enter')edit(x.id)};if(x.img){let im=document.createElement('img');im.src=x.img;im.alt=x.name;im.onerror=()=>{c.textContent='이미지 없음'};c.append(im)}else c.textContent='이미지 없음';let m=el('div','meta'),v=el('div','name',x.name),b=el('button','',x.fav?'★':'☆');b.title='즐겨찾기';b.onclick=()=>save(data.map(y=>y.id===x.id?{...y,fav:!y.fav}:y));m.append(v,b);a.append(c,m,el('div','small',[x.pub,x.category].filter(Boolean).join(' · ')),el('div','tags',x.tags.join(' · ')));$('grid').append(a)}}function edit(id){current=id||null;let x=data.find(y=>y.id===id)||{};$('form').reset();for(let k of ['name','pub','note','link'])$(k==='name'?'bookname':k).value=x[k]||'';$('category').value=x.category||cats[0];$('tags').value=(x.tags||[]).join(', ');$('url').value=x.img?.startsWith('http')?x.img:'';$('remove').hidden=!id;$('visit').hidden=!x.link;$('heading').textContent=id?'표지 상세 / 수정':'표지 등록';$('dlg').showModal()}function del(){if(confirm('이 표지를 삭제할까요?')&&save(data.filter(x=>x.id!==current)))$('dlg').close()}async function resize(f){let im=await new Promise((resolve,reject)=>{let i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);resolve(i)};i.onerror=()=>{URL.revokeObjectURL(u);reject(Error('이미지 읽기 실패'))};i.src=u}),s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}$('saveButton').onclick=async e=>{e.preventDefault();try{let old=data.find(x=>x.id===current),img=$('url').value|| (old?.img?.startsWith('data:')?old.img:'');try{if($('photo').files[0])img=await resize($('photo').files[0])}catch{alert('이미지를 읽을 수 없습니다.');return}let x={id:current||(globalThis.crypto?.randomUUID?.() || Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)),img,fav:old?.fav||false,category:$('category').value,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean)};for(let k of ['name','pub','note','link'])x[k]=$(k==='name'?'bookname':k).value.trim();if(!x.name)x.name=$('photo').files[0]?.name.replace(/\.[^.]+$/,'')||old?.name||'제목 미정';if(!img){alert('표지 이미지 파일 또는 URL을 입력하세요.');return}if(save(current?data.map(y=>y.id===current?x:y):[x,...data]))$('dlg').close()}catch(err){alert('등록 실패: '+err.message)}};for(let k of ['q','cat','tag'])$(k).addEventListener(k==='q'?'input':'change',render);$('fav').onclick=()=>{only=!only;$('fav').textContent=only?'★ 즐겨찾기':'☆ 즐겨찾기';render()};function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='cover-archive.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('import').onchange=async e=>{try{let arr=JSON.parse(await e.target.files[0].text());if(!Array.isArray(arr)||!arr.every(x=>typeof x.id==='string'&&typeof x.name==='string'&&Array.isArray(x.tags)&&x.tags.every(t=>typeof t==='string')))throw Error();let m=new Map(data.map(x=>[x.id,x]));for(let x of arr)if(!m.has(x.id))m.set(x.id,x);save([...m.values()])}catch{alert('올바른 아카이브 JSON 파일을 선택하세요.')}e.target.value=''};render();</script></html>
